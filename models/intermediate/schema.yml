version: 2

models:
  - name: int_search_flag
    description: >
      Aggregates raw search-basis records to the person-stop grain. Produces a
      search flag, count of distinct search bases, and pipe-delimited list of
      recorded search bases for each stop_id/person_id combination.
    columns:
      - name: stop_id
        description: "Stop identifier."
        tests:
          - not_null

      - name: person_id
        description: "Person identifier within the stop."
        tests:
          - not_null

      - name: had_search
        description: "1 if the person-stop had at least one nonblank search basis recorded, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: distinct_search_basis_count
        description: "Number of distinct nonblank search bases recorded for the person-stop."

      - name: search_basis_list
        description: "Pipe-delimited list of distinct nonblank search bases recorded for the person-stop."

  - name: int_find_flag
    description: >
      Aggregates raw contraband/evidence records to the person-stop grain.
      Produces a find flag, count of distinct contraband/evidence types, and
      pipe-delimited list of recorded contraband/evidence types for each
      stop_id/person_id combination.
    columns:
      - name: stop_id
        description: "Stop identifier."
        tests:
          - not_null

      - name: person_id
        description: "Person identifier within the stop."
        tests:
          - not_null

      - name: had_find
        description: "1 if the person-stop had at least one nonblank contraband/evidence type recorded, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: distinct_contraband_type_count
        description: "Number of distinct nonblank contraband/evidence types recorded for the person-stop."

      - name: contraband_type_list
        description: "Pipe-delimited list of distinct nonblank contraband/evidence types recorded for the person-stop."

  - name: int_race_summary
    description: >
      Aggregates raw perceived-race records to the person-stop grain. Produces
      one perceived-race value per stop_id/person_id combination, preserving
      single-race values and grouping multi-race or conflicting records as
      Multiple/ambiguous race.
    columns:
      - name: stop_id
        description: "Stop identifier."
        tests:
          - not_null

      - name: person_id
        description: "Person identifier within the stop."
        tests:
          - not_null

      - name: perceived_race
        description: "Single perceived-race value for the person-stop, or Multiple/ambiguous race when multiple distinct values are present."

      - name: distinct_perceived_race_count
        description: "Number of distinct nonblank perceived-race values recorded for the person-stop."

      - name: perceived_race_list
        description: "Pipe-delimited list of distinct nonblank perceived-race values recorded for the person-stop."

  - name: int_stop_reason_summary
    description: >
      Aggregates raw stop-reason records to the person-stop grain. Produces one
      stop-reason value per stop_id/person_id combination, preserving single
      stop reasons and grouping multi-reason records as Multiple stop reasons.
    columns:
      - name: stop_id
        description: "Stop identifier."
        tests:
          - not_null

      - name: person_id
        description: "Person identifier within the stop."
        tests:
          - not_null

      - name: stop_reason
        description: "Single stop-reason value for the person-stop, or Multiple stop reasons when multiple distinct values are present."

      - name: distinct_stop_reason_count
        description: "Number of distinct nonblank stop-reason values recorded for the person-stop."

      - name: stop_reason_list
        description: "Pipe-delimited list of distinct nonblank stop-reason values recorded for the person-stop."