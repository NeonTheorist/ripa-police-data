version: 2

models:
  - name: fct_ripa_person_stop
    description: "One row per person on a stop, with search and find flags plus core demographic and stop context fields."
    columns:
      - name: stop_id
        tests: [not_null]
      - name: pid
        tests: [not_null]
      - name: stop_date
        tests: [not_null]
      - name: stop_month
        tests: [not_null]
      - name: had_search
        tests: [not_null]
      - name: had_find
        tests: [not_null]
